name: Check Selectel WB token

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-selectel-wb.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check WB token on Selectel
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          USER: ${{ secrets.SELECTEL_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts
          ssh -p "${PORT:-22}" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "INTEGRATIONS_FILE=$(grep -q '^WB_API_TOKEN=' /root/duisun-integrations.env 2>/dev/null && echo yes || echo no)"
          echo "PRODUCTION_FILE=$(grep -q '^WB_API_TOKEN=' /var/www/duisun/.env.production 2>/dev/null && echo yes || echo no)"
          if [ -f /root/duisun-integrations.env ]; then
            set -a; source /root/duisun-integrations.env; set +a
          elif [ -f /var/www/duisun/.env.production ]; then
            set -a; source /var/www/duisun/.env.production; set +a
          fi
          if [ -z "${WB_API_TOKEN:-}" ]; then
            echo "WB_TOKEN_PRESENT=no"
            exit 0
          fi
          echo "WB_TOKEN_PRESENT=yes"
          STATUS=$(curl -sS -o /tmp/wb-check.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: $WB_API_TOKEN" \
            'https://marketplace-api.wildberries.ru/api/v3/warehouses' || true)
          echo "WB_WAREHOUSES_HTTP=$STATUS"
          rm -f /tmp/wb-check.json
          REMOTE
