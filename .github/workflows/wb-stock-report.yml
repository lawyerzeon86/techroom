name: WB FBS Stock Report

on:
  push:
    branches: [main]

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          USER: ${{ secrets.SELECTEL_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts
          ssh -p "${PORT:-22}" "$USER@$HOST" 'cd /var/www/duisun; git fetch origin main; git reset --hard origin/main; set -a; source .env.production; set +a; node scripts/list-wb-fbs-stock-once.mjs'
