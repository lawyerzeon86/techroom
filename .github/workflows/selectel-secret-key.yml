name: Prepare Selectel secret handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/selectel-secret-key.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate one-time encryption key on Selectel
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          USER: ${{ secrets.SELECTEL_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts
          ssh -p "${PORT:-22}" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          rm -f /root/.duisun-wb-handoff-private.pem /root/.duisun-wb-handoff-public.pem
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /root/.duisun-wb-handoff-private.pem >/dev/null 2>&1
          openssl pkey -in /root/.duisun-wb-handoff-private.pem -pubout -out /root/.duisun-wb-handoff-public.pem >/dev/null 2>&1
          echo "PUBLIC_KEY_B64_BEGIN"
          base64 -w0 /root/.duisun-wb-handoff-public.pem
          echo
          echo "PUBLIC_KEY_B64_END"
          REMOTE
