name: Remove Choker stock from WB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/wb-remove-chokers.trigger'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts
      - name: Set all Choker WB stocks to zero
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          USER: ${{ secrets.SELECTEL_USER }}
        run: |
          set -euo pipefail
          ssh -p "${PORT:-22}" "$USER@$HOST" 'bash -s' > /tmp/wb-remove-chokers.json <<'REMOTE'
          set -euo pipefail
          cd /var/www/duisun
          DB_URL="$(node --env-file=.env.production -e "process.stdout.write(process.env.DATABASE_URL||'')")"
          test -n "$DB_URL"
          psql "$DB_URL" -Atc 'SELECT cards::text FROM wb_catalog_cache ORDER BY fetched_at DESC NULLS LAST LIMIT 1' > /tmp/wb-cards.json
          psql "$DB_URL" -Atc "SELECT json_build_object('priceSheet',coalesce(json_agg(x),'[]'::json),'recentSync',coalesce((SELECT json_agg(r) FROM (SELECT started_at,finished_at,ok,result FROM marketplace_sync_runs ORDER BY started_at DESC LIMIT 5) r),'[]'::json)) FROM (SELECT sku,title,sync_wb,coalesce((SELECT stock FROM products p WHERE p.sku=ps.sku LIMIT 1),0) stock FROM price_sheet ps WHERE sku ~* 'chok+er|чок+ер' OR title ~* 'chok+er|чок+ер') x" > /tmp/wb-choker-cause.json
          node --env-file=.env.production --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const token=(process.env.WB_API_TOKEN||'').trim();
          const warehouseId=(process.env.WB_WAREHOUSE_ID||'604848').trim();
          if(!token) throw new Error('WB_API_TOKEN is not configured');
          const cached=JSON.parse(readFileSync('/tmp/wb-cards.json','utf8'));
          const cards=Array.isArray(cached)?cached:[];
          let cursor={limit:100};
          for(let page=0;page<100;page++){
            const res=await fetch('https://content-api.wildberries.ru/content/v2/get/cards/list',{method:'POST',headers:{Authorization:token,'Content-Type':'application/json'},body:JSON.stringify({settings:{cursor,filter:{withPhoto:-1},sort:{ascending:false}}}),signal:AbortSignal.timeout(20000)});
            const text=await res.text();
            let data={}; try{data=text?JSON.parse(text):{}}catch{}
            if(!res.ok) throw new Error(`WB catalog read ${res.status}: ${text.slice(0,500)}`);
            const part=Array.isArray(data?.cards)?data.cards:[];
            cards.push(...part);
            if(part.length<100||!data?.cursor?.updatedAt||!data?.cursor?.nmID) break;
            cursor={limit:100,updatedAt:data.cursor.updatedAt,nmID:data.cursor.nmID};
          }
          const uniqueCards=[...new Map(cards.map(card=>[String(card?.nmID||card?.vendorCode||JSON.stringify(card)),card])).values()];
          const matched=uniqueCards.filter(card=>/chok+er|чок+ер/i.test(JSON.stringify(card)));
          if(!matched.length) throw new Error('No Choker products found in WB catalog cache');
          const stocks=[];
          const products=[];
          for(const card of matched){
            const skus=[];
            const chrtIds=[];
            for(const size of Array.isArray(card?.sizes)?card.sizes:[]){
              if(size?.chrtID||size?.chrtId) chrtIds.push(Number(size.chrtID||size.chrtId));
              for(const sku of Array.isArray(size?.skus)?size.skus:[]) if(sku) skus.push(String(sku));
            }
            const unique=[...new Set(skus)];
            for(const sku of unique) stocks.push({sku,amount:0});
            products.push({nmID:String(card?.nmID||''),vendorCode:String(card?.vendorCode||''),title:String(card?.title||card?.subjectName||''),skus:unique,chrtIds});
          }
          if(!stocks.length) throw new Error('Choker products found, but WB barcodes are missing');
          const put=await fetch(`https://marketplace-api.wildberries.ru/api/v3/stocks/${encodeURIComponent(warehouseId)}`,{method:'PUT',headers:{Authorization:token,'Content-Type':'application/json'},body:JSON.stringify({stocks}),signal:AbortSignal.timeout(20000)});
          const putText=await put.text();
          if(!put.ok) throw new Error(`WB stock update ${put.status}: ${putText.slice(0,500)}`);
          const chrtIds=[...new Set(products.flatMap(p=>p.chrtIds).filter(Number.isFinite))];
          const verify=await fetch(`https://marketplace-api.wildberries.ru/api/v3/stocks/${encodeURIComponent(warehouseId)}`,{method:'POST',headers:{Authorization:token,'Content-Type':'application/json'},body:JSON.stringify({chrtIds}),signal:AbortSignal.timeout(20000)});
          const verifyText=await verify.text();
          let verifyJson={}; try{verifyJson=verifyText?JSON.parse(verifyText):{}}catch{}
          if(!verify.ok) throw new Error(`WB stock verification ${verify.status}: ${verifyText.slice(0,500)}`);
          const remaining=(verifyJson.stocks||[]).filter(s=>Number(s.amount||0)!==0);
          if(remaining.length) throw new Error(`Some Choker stocks are not zero: ${JSON.stringify(remaining)}`);
          const nmIDs=[...new Set(products.map(p=>Number(p.nmID)).filter(n=>Number.isFinite(n)&&n>0))];
          const archive=await fetch('https://content-api.wildberries.ru/content/v2/cards/delete/trash',{method:'POST',headers:{Authorization:token,'Content-Type':'application/json'},body:JSON.stringify({nmIDs}),signal:AbortSignal.timeout(20000)});
          const archiveText=await archive.text();
          if(!archive.ok && archive.status!==208) throw new Error(`WB archive ${archive.status}: ${archiveText.slice(0,500)}`);
          execFileSync('psql',[process.env.DATABASE_URL,'-v','ON_ERROR_STOP=1','-c',`UPDATE price_sheet SET sync_wb=FALSE,updated_at=NOW() WHERE sku ~* 'chok+er|чок+ер' OR title ~* 'chok+er|чок+ер'; UPDATE products SET stock=0,is_active=FALSE,updated_at=NOW() WHERE sku ~* 'chok+er|чок+ер' OR title ~* 'chok+er|чок+ер';`],{stdio:'ignore'});
          const cause=JSON.parse(readFileSync('/tmp/wb-choker-cause.json','utf8'));
          process.stdout.write(JSON.stringify({ok:true,checkedAt:new Date().toISOString(),warehouseId,matchedProducts:products.length,updatedBarcodes:stocks.length,archivedNmIDs:nmIDs,products,verifiedStocks:verifyJson.stocks||[],cause,protection:{priceSheetSyncWbDisabled:true,localProductsDeactivated:true}},null,2));
          NODE
          REMOTE
      - name: Commit report
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/wb-remove-chokers.json ops/wb-remove-chokers.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/wb-remove-chokers.json
          git diff --cached --quiet || git commit -m 'Record WB Choker stock removal [skip ci]'
          git push origin HEAD:main
