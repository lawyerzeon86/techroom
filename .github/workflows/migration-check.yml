name: Migration verification
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Selectel without exposing customer data
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          SSH_KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts
          ssh -p "${PORT:-22}" "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/duisun
          set -a; source .env.production; set +a
          /usr/local/bin/duisun-backup
          CFG=$(mktemp /run/duisun-verify.XXXXXX)
          trap 'rm -f "$CFG"' EXIT
          chmod 600 "$CFG"
          printf 'header = "x-cron-secret: %s"\n' "$CRON_SYNC_SECRET" > "$CFG"
          for mode in core communications transfers; do
            query='force=1'
            [ "$mode" = communications ] && query='force=1&communications=1'
            [ "$mode" = transfers ] && query='force=1&transfers=1'
            curl -fsS --max-time 300 -X POST --config "$CFG" "http://127.0.0.1:3000/api/internal/marketplace-sync?$query" > "/var/log/duisun-sync-$mode-last.json"
            node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(r.ok!==true||r.partial){console.error(JSON.stringify(r.partialErrors||["SYNC_FAILED"]));process.exit(1)}' "/var/log/duisun-sync-$mode-last.json"
          done
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import fs from 'node:fs';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,ssl:process.env.DATABASE_URL.includes('localhost')?false:{rejectUnauthorized:false}});
          const tables=await pool.query("SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename");
          const counts={};
          for(const {tablename} of tables.rows){const q='"'+tablename.replaceAll('"','""')+'"';counts[tablename]=Number((await pool.query(`SELECT count(*) FROM ${q}`)).rows[0].count)}
          console.log('DATABASE_COUNTS',JSON.stringify(counts));
          console.log('DATABASE_TARGET',new URL(process.env.DATABASE_URL).hostname);
          for(const mode of ['core','communications','transfers']){
            const path=`/var/log/duisun-sync-${mode}-last.json`;
            try{const r=JSON.parse(fs.readFileSync(path,'utf8'));console.log('SYNC_'+mode,JSON.stringify({ok:r.ok,partial:r.partial,partialErrors:r.partialErrors,skipped:r.skipped,reason:r.reason,imports:r.productHub?.imports,transfer:r.productHub?.transfer?{processed:r.productHub.transfer.processed,statuses:r.productHub.transfer.results?.reduce((o,x)=>(o[x.status]=(o[x.status]||0)+1,o),{})}:undefined,communications:{wb:r.stages?.wildberries,ozon:r.stages?.ozon},priceGuard:r.stages?.priceGuard?.results?.map(x=>({marketplace:x.marketplace,status:x.status,error:x.error}))}))}catch{console.log('SYNC_'+mode,'NO_VALID_RESULT')}
          }
          await pool.end();
          NODE
          systemctl is-active duisun-sync-core.timer duisun-sync-communications.timer duisun-sync-transfers.timer duisun-backup.timer
          curl -fsS http://127.0.0.1:3000/api/health
          REMOTE
