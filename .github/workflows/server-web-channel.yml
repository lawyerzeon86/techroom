name: Server web channel

on:
  push:
    branches: [main]
    paths:
      - 'ops/server-web-request.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-web-channel
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run safe Selectel operation
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          USER: ${{ secrets.SELECTEL_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "${USER:-root}"
          test -n "$SSH_KEY"
          REQUEST="$(tr '\n' ' ' < ops/server-web-request.txt | head -c 500)"
          REQUEST_B64="$(printf '%s' "$REQUEST" | base64 -w0)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -p "${PORT:-22}" "${USER:-root}@$HOST" "bash -s -- '$REQUEST_B64'" > /tmp/server-web-status.json <<'REMOTE'
          set -euo pipefail
          REQUEST_B64="$1"
          cd /var/www/duisun
          git fetch origin main
          git reset --hard origin/main
          set -a
          source .env.production
          set +a
          export WEB_OP_REQUEST="$(printf '%s' "$REQUEST_B64" | base64 -d)"
          node scripts/web-ops.mjs
          REMOTE

      - name: Publish sanitized status
        run: |
          set -euo pipefail
          jq . /tmp/server-web-status.json >/dev/null
          cp /tmp/server-web-status.json ops/server-web-status.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/server-web-status.json ops/server-web-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/server-web-status.json
          git diff --cached --quiet || git commit -m "Update server web status [skip ci]"
          git push origin HEAD:main
