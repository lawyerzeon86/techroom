name: Verify Selectel WB token hash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-selectel-wb-hash.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify token hash on Selectel
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          USER: ${{ secrets.SELECTEL_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts
          ssh -p "${PORT:-22}" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/duisun
          set -a
          source .env.production
          set +a
          test -n "${WB_API_TOKEN:-}"
          printf '%s' "$WB_API_TOKEN" | sha256sum | awk '{print "WB_TOKEN_SHA256="$1}'
          REMOTE
