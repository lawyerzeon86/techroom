name: Marketplace Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger TechRoom marketplace sync
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 540 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            'https://techroom-main.onrender.com/api/internal/marketplace-sync')"
          echo "HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
