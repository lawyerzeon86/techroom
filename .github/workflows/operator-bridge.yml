name: Operator Bridge

on:
  push:
    branches: [main]
    paths:
      - 'ops/operator-request.json'
      - '.github/workflows/operator-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run operator request on Selectel
        env:
          HOST: ${{ secrets.SELECTEL_HOST }}
          PORT: ${{ secrets.SELECTEL_PORT }}
          USER: ${{ secrets.SELECTEL_USER }}
          SSH_KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$SSH_KEY"
          USER="${USER:-root}"
          PORT="${PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          scp -P "$PORT" ops/operator-request.json "$USER@$HOST:/tmp/duisun-operator-request.json"
          ssh -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/duisun
          set -a
          [ -f .env.production ] && source .env.production
          [ -f /root/duisun-integrations.env ] && source /root/duisun-integrations.env
          set +a
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const req=JSON.parse(fs.readFileSync('/tmp/duisun-operator-request.json','utf8'));
          const token=process.env.WB_API_TOKEN?.trim();
          if(!token) throw new Error('WB_API_TOKEN_NOT_CONFIGURED');
          const headers={Authorization:token,'Content-Type':'application/json'};
          async function post(url,body){
            const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});
            const text=await r.text();
            let data; try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
            if(!r.ok) throw new Error('HTTP_'+r.status+' '+JSON.stringify(data));
            return data;
          }
          async function put(url,body){
            const r=await fetch(url,{method:'PUT',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});
            const text=await r.text();
            let data; try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
            if(!r.ok) throw new Error('HTTP_'+r.status+' '+JSON.stringify(data));
            return data;
          }
          async function allCards(){
            const cards=[]; let cursor={limit:100};
            for(let page=0;page<50;page++){
              const data=await post('https://content-api.wildberries.ru/content/v2/get/cards/list',{settings:{cursor,filter:{withPhoto:-1},sort:{ascending:false}}});
              const part=Array.isArray(data?.cards)?data.cards:[];
              cards.push(...part);
              if(part.length<100||!data?.cursor?.updatedAt||!data?.cursor?.nmID) break;
              cursor={limit:100,updatedAt:data.cursor.updatedAt,nmID:data.cursor.nmID};
            }
            return cards;
          }
          if(req.action==='wb_catalog_status'){
            const cards=await allCards();
            const errors=await post('https://content-api.wildberries.ru/content/v2/cards/error/list',{});
            const errorItems=Array.isArray(errors?.data?.items)?errors.data.items:[];
            const warehouseId=String(process.env.WB_WAREHOUSE_ID||'').trim();
            if(!warehouseId) throw new Error('WB_WAREHOUSE_ID_NOT_CONFIGURED');
            const chrtIds=cards.flatMap(card=>(Array.isArray(card?.sizes)?card.sizes:[]).map(s=>Number(s?.chrtID)).filter(Number.isFinite));
            const fbsData=chrtIds.length?await post('https://marketplace-api.wildberries.ru/api/v3/stocks/'+encodeURIComponent(warehouseId),{chrtIds}):{stocks:[]};
            const fbsMap=new Map((Array.isArray(fbsData?.stocks)?fbsData.stocks:[]).map(x=>[Number(x.chrtId),Number(x.amount)||0]));
            let fboRaw=null, fboError=null;
            try{
              fboRaw=await post('https://seller-analytics-api.wildberries.ru/api/analytics/v1/stocks-report/wb-warehouses',{nmIds:cards.map(x=>Number(x.nmID)).filter(Number.isFinite),limit:1000,offset:0});
            }catch(e){ fboError=String(e?.message||e); }
            const rows=Array.isArray(fboRaw)?fboRaw:(Array.isArray(fboRaw?.data)?fboRaw.data:(Array.isArray(fboRaw?.stocks)?fboRaw.stocks:[]));
            const fboMap=new Map();
            for(const row of rows){
              const id=Number(row?.nmId ?? row?.nmID);
              if(!Number.isFinite(id)) continue;
              const qty=Number(row?.quantity ?? row?.amount ?? row?.stock ?? row?.stockCount ?? row?.quantityFull ?? 0)||0;
              fboMap.set(id,(fboMap.get(id)||0)+qty);
            }
            const products=cards.map(card=>{
              const cardErrors=errorItems.filter(e=>Array.isArray(e?.vendorCodes)&&e.vendorCodes.includes(card.vendorCode));
              const fbs=(Array.isArray(card?.sizes)?card.sizes:[]).reduce((sum,s)=>sum+(fbsMap.get(Number(s?.chrtID))||0),0);
              const fbo=fboMap.get(Number(card.nmID))||0;
              return {nmID:card.nmID,vendorCode:card.vendorCode,title:card.title,status:cardErrors.length?'ERROR':'OK',errors:cardErrors.map(e=>e?.errors||e?.errorText||e?.message||e),fbs,fbo};
            });
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify({ok:true,action:req.action,warehouseId,fboError,fboSample:rows.slice(0,2),products}));
            console.log('OPERATOR_RESULT_END');
          } else if(req.action==='wb_get_catalog_with_photos'){
            const cards=await allCards();
            const products=cards.map(card=>({
              nmID:card.nmID,
              vendorCode:card.vendorCode,
              title:card.title,
              photo:Array.isArray(card.photos)&&card.photos[0]?card.photos[0].c246x328||card.photos[0].big:null
            }));
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify({ok:true,action:req.action,products}));
            console.log('OPERATOR_RESULT_END');
          } else if(req.action==='wb_get_products'){
            const vendorCodes=Array.isArray(req.vendorCodes)?req.vendorCodes.map(x=>String(x).trim()).filter(Boolean):[];
            if(!vendorCodes.length) throw new Error('VENDOR_CODES_REQUIRED');
            const cards=await allCards();
            const selected=cards.filter(x=>vendorCodes.includes(String(x?.vendorCode||''))).map(card=>({
              nmID:card.nmID,
              vendorCode:card.vendorCode,
              title:card.title,
              description:card.description,
              dimensions:card.dimensions,
              characteristics:card.characteristics,
              sizes:card.sizes
            }));
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify({ok:true,action:req.action,products:selected}));
            console.log('OPERATOR_RESULT_END');
          } else if(req.action==='wb_drafts_search'){
            const q=String(req.q||'').toLowerCase();
            const errors=await post('https://content-api.wildberries.ru/content/v2/cards/error/list',{});
            const out={ok:true,action:req.action,q,errors};
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify(out));
            console.log('OPERATOR_RESULT_END');
          } else if(req.action==='wb_remove_description_emoji'){
            const vendorCode=String(req.vendorCode||'').trim();
            if(!vendorCode) throw new Error('VENDOR_CODE_REQUIRED');
            const cards=await allCards();
            const card=cards.find(x=>String(x?.vendorCode||'')===vendorCode);
            if(!card) throw new Error('WB_CARD_NOT_FOUND');
            const before=String(card.description||'');
            const after=before
              .replace(/\p{Extended_Pictographic}/gu,'')
              .replace(/[\uFE0E\uFE0F\u200D]/g,'')
              .replace(/[\u{1F1E6}-\u{1F1FF}]/gu,'')
              .replace(/[\u{1F3FB}-\u{1F3FF}]/gu,'')
              .replace(/[ \t]{2,}/g,' ')
              .replace(/ *\n */g,'\n')
              .trim();
            const keys=['nmID','vendorCode','brand','title','description','dimensions','characteristics','sizes','kizMarked','wholesale'];
            const payload={}; for(const k of keys) if(card?.[k]!==undefined) payload[k]=card[k];
            payload.description=after;
            const result=await post('https://content-api.wildberries.ru/content/v2/cards/update',[payload]);
            const errors=await post('https://content-api.wildberries.ru/content/v2/cards/error/list',{});
            const remaining=(errors?.data?.items||[]).filter(x=>Array.isArray(x?.vendorCodes)&&x.vendorCodes.includes(vendorCode));
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify({ok:true,action:req.action,vendorCode,nmID:card.nmID,title:card.title,descriptionChanged:before!==after,removedChars:before.length-after.length,result,remainingErrors:remaining}));
            console.log('OPERATOR_RESULT_END');
          } else if(req.action==='wb_set_country'){
            const vendorCodes=Array.isArray(req.vendorCodes)?req.vendorCodes.map(x=>String(x).trim()).filter(Boolean):[];
            const country=String(req.country||'').trim();
            if(!vendorCodes.length||!country) throw new Error('INVALID_REQUEST');
            const cards=await allCards();
            const payloads=[];
            const meta=[];
            for(const vendorCode of vendorCodes){
              const card=cards.find(x=>String(x?.vendorCode||'')===vendorCode);
              if(!card) throw new Error('WB_CARD_NOT_FOUND_'+vendorCode);
              const keys=['nmID','vendorCode','brand','title','description','dimensions','characteristics','sizes','kizMarked','wholesale'];
              const payload={}; for(const k of keys) if(card?.[k]!==undefined) payload[k]=card[k];
              const chars=Array.isArray(payload.characteristics)?payload.characteristics.map(x=>({...x})): [];
              const idx=chars.findIndex(x=>Number(x?.id)===14177451 || String(x?.name||'').toLowerCase()==='страна производства');
              if(idx>=0) chars[idx]={...chars[idx],value:[country]};
              else chars.push({id:14177451,name:'Страна производства',value:[country]});
              payload.characteristics=chars;
              payloads.push(payload);
              meta.push({vendorCode,nmID:card.nmID,title:card.title});
            }
            const result=await post('https://content-api.wildberries.ru/content/v2/cards/update',payloads);
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify({ok:true,action:req.action,country,items:meta,result}));
            console.log('OPERATOR_RESULT_END');
          } else if(req.action==='wb_update_descriptions'){
            const items=Array.isArray(req.items)?req.items:[];
            if(!items.length) throw new Error('ITEMS_REQUIRED');
            const cards=await allCards();
            const payloads=[];
            const meta=[];
            for(const item of items){
              const vendorCode=String(item?.vendorCode||'').trim();
              const description=String(item?.description||'').trim();
              if(!vendorCode||!description) throw new Error('INVALID_ITEM');
              const card=cards.find(x=>String(x?.vendorCode||'')===vendorCode);
              if(!card) throw new Error('WB_CARD_NOT_FOUND_'+vendorCode);
              const keys=['nmID','vendorCode','brand','title','description','dimensions','characteristics','sizes','kizMarked','wholesale'];
              const payload={}; for(const k of keys) if(card?.[k]!==undefined) payload[k]=card[k];
              payload.description=description;
              payloads.push(payload);
              meta.push({vendorCode,nmID:card.nmID,title:card.title});
            }
            const result=await post('https://content-api.wildberries.ru/content/v2/cards/update',payloads);
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify({ok:true,action:req.action,items:meta,result}));
            console.log('OPERATOR_RESULT_END');
          } else if(req.action==='wb_update_stock_by_nmid'){
            const nmID=Number(req.nmID);
            const amount=Number(req.amount);
            if(!Number.isFinite(nmID)||!Number.isFinite(amount)||amount<0) throw new Error('INVALID_REQUEST');
            const cards=await allCards();
            const card=cards.find(x=>Number(x?.nmID)===nmID);
            if(!card) throw new Error('WB_CARD_NOT_FOUND');
            const warehouseId=String(process.env.WB_WAREHOUSE_ID||'').trim();
            if(!warehouseId) throw new Error('WB_WAREHOUSE_ID_NOT_CONFIGURED');
            const stocks=[];
            for(const size of (Array.isArray(card?.sizes)?card.sizes:[])){
              for(const sku of (Array.isArray(size?.skus)?size.skus:[])){
                if(String(sku||'').trim()) stocks.push({sku:String(sku),amount:Math.round(amount)});
              }
            }
            if(!stocks.length) throw new Error('WB_SKU_NOT_FOUND');
            const stockResult=await put('https://marketplace-api.wildberries.ru/api/v3/stocks/'+encodeURIComponent(warehouseId),{stocks});
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify({ok:true,action:req.action,nmID:card.nmID,vendorCode:card.vendorCode,title:card.title,warehouseId,skus:stocks.map(x=>x.sku),amount:Math.round(amount),stockResult}));
            console.log('OPERATOR_RESULT_END');
          } else if(req.action==='wb_update_product_and_stock'){
            const vendorCode=String(req.vendorCode||'').trim();
            const description=String(req.description||'').trim();
            const amount=Number(req.amount);
            if(!vendorCode||!description||!Number.isFinite(amount)||amount<0) throw new Error('INVALID_REQUEST');
            const cards=await allCards();
            const card=cards.find(x=>String(x?.vendorCode||'')===vendorCode);
            if(!card) throw new Error('WB_CARD_NOT_FOUND');
            const keys=['nmID','vendorCode','brand','title','description','dimensions','characteristics','sizes','kizMarked','wholesale'];
            const payload={}; for(const k of keys) if(card?.[k]!==undefined) payload[k]=card[k];
            payload.description=description;
            const cardResult=await post('https://content-api.wildberries.ru/content/v2/cards/update',[payload]);
            const warehouseId=String(process.env.WB_WAREHOUSE_ID||'').trim();
            if(!warehouseId) throw new Error('WB_WAREHOUSE_ID_NOT_CONFIGURED');
            const stocks=[];
            for(const size of (Array.isArray(card?.sizes)?card.sizes:[])){
              for(const sku of (Array.isArray(size?.skus)?size.skus:[])){
                if(String(sku||'').trim()) stocks.push({sku:String(sku),amount:Math.round(amount)});
              }
            }
            if(!stocks.length) throw new Error('WB_SKU_NOT_FOUND');
            const stockResult=await post('https://marketplace-api.wildberries.ru/api/v3/stocks/'+encodeURIComponent(warehouseId),{stocks});
            console.log('OPERATOR_RESULT_BEGIN');
            console.log(JSON.stringify({ok:true,action:req.action,vendorCode,nmID:card.nmID,title:card.title,warehouseId,skus:stocks.map(x=>x.sku),amount:Math.round(amount),cardResult,stockResult}));
            console.log('OPERATOR_RESULT_END');
          } else {
            throw new Error('Unsupported action');
          }
          NODE
          rm -f /tmp/duisun-operator-request.json
          REMOTE
