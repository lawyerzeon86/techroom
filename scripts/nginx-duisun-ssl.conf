server {
    listen 80;
    listen [::]:80;
    server_name duisun.ru www.duisun.ru;
    return 301 https://duisun.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.duisun.ru;

    ssl_certificate /etc/letsencrypt/live/duisun.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duisun.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://duisun.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name duisun.ru;

    client_max_body_size 50M;
    ssl_certificate /etc/letsencrypt/live/duisun.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duisun.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_set_header Host $host;
    }
}
